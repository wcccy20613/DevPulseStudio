name: Generate DevPulse catalog

on:
  workflow_dispatch:
  schedule:
    # 00:17 Asia/Shanghai (UTC+8). Avoiding minute 0 reduces scheduler contention.
    - cron: "17 16 * * *"

permissions:
  contents: write

concurrency:
  group: devpulse-catalog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate public catalog and snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional OpenAI-compatible provider. Keep the key in Actions Secrets, never in Android.
          AI_API_BASE_URL: ${{ vars.AI_API_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_INSIGHT_LIMIT: "30"
        run: node scripts/generate-static-catalog.mjs
      - name: Commit generated catalog when changed
        run: |
          if git diff --quiet -- static; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static
          git commit -m "chore(data): refresh DevPulse catalog"
          git push
