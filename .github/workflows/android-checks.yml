name: Android checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Debug build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  emulator-smoke:
    name: Android emulator baseline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Make the Gradle wrapper and smoke script executable
        run: chmod +x ./gradlew ./scripts/ci-emulator-smoke.sh ./scripts/ci-run-emulator-smoke.sh ./scripts/ci-wait-for-android-framework.sh
      - name: Enable KVM access for the Android emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Room cache test and launch debug app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Keep build/lint on compileSdk 35, while using a stable API 30 image
          # for deterministic baseline instrumentation coverage in CI.
          api-level: 30
          target: google_apis
          arch: x86_64
          # The action only waits for sys.boot_completed. Apply animations
          # ourselves after all framework services are confirmed ready.
          disable-animations: false
          # android-emulator-runner executes multi-line input command-by-command.
          # Keep all control flow in this single helper invocation.
          script: sh ./scripts/ci-run-emulator-smoke.sh
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-smoke-artifacts
          path: app/build/reports/emulator-smoke/
          if-no-files-found: warn
