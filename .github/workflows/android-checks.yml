name: Android checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Debug build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  emulator-smoke:
    name: Android emulator baseline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper and smoke script executable
        run: chmod +x ./gradlew ./scripts/ci-emulator-smoke.sh
      - name: Run Room cache test and launch debug app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Keep build/lint on compileSdk 35, while using a stable API 30 image
          # for deterministic baseline instrumentation coverage in CI.
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -u
            set +e
            ./gradlew --no-daemon --stacktrace --info :app:connectedDebugAndroidTest
            test_exit=$?
            if [ "$test_exit" -ne 0 ]; then
              mkdir -p app/build/reports/emulator-smoke
              timeout 30 adb logcat -d -v threadtime -t 1200 > app/build/reports/emulator-smoke/connected-test-logcat.txt 2>&1 || true
              exit "$test_exit"
            fi
            set -e
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
            ./scripts/ci-emulator-smoke.sh
      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Upload emulator smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-artifacts
          path: app/build/reports/emulator-smoke/
          if-no-files-found: warn
